
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客 - 逢坂大河ws的综合站</title>

<style>
:root {
  --bg: #f7f5f3;
  --card: #ffffff;
  --text: #302b29;
  --muted: #817873;
  --accent: #b77b70;
  --border: #e9e2de;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 15px 60px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.container {
  max-width: 900px;
  margin: auto;
}

a {
  color: inherit;
  text-decoration: none;
}

header {
  padding: 25px 0 30px;
}

.back {
  color: var(--accent);
  font-size: 14px;
}

header h1 {
  font-size: 30px;
  margin: 22px 0 8px;
}

header p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
}

.search-box {
  margin: 15px 0 20px;
}

.search-box input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
  font-size: 15px;
  outline: none;
}

.search-box input:focus {
  border-color: var(--accent);
}

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 20px 0;
}

.category {
  padding: 9px 15px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: white;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
}

.category.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.section-title {
  font-size: 19px;
  margin: 30px 0 15px;
}

.article-list {
  display: grid;
  gap: 14px;
}

.article {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 20px;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}

.article:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 20px #00000008;
}

.article-category {
  display: inline-block;
  color: var(--accent);
  background: #f8eeeb;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
}

.article h2 {
  font-size: 19px;
  margin: 13px 0 9px;
}

.article p {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.8;
  margin: 0 0 13px;
}

.article-meta {
  color: #a49a94;
  font-size: 12px;
}

.empty {
  background: white;
  border-radius: 12px;
  padding: 35px 15px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

#detail {
  display: none;
  background: white;
  padding: 25px;
  border-radius: 16px;
  border: 1px solid var(--border);
  margin-top: 20px;
}

#detail h2 {
  font-size: 25px;
  line-height: 1.5;
}

.detail-meta {
  color: var(--muted);
  font-size: 13px;
  margin: 12px 0 25px;
}

.detail-content {
  font-size: 15px;
  line-height: 2;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.detail-content p {
  margin: 0 0 16px;
}

.back-list {
  color: var(--accent);
  border: 0;
  background: transparent;
  padding: 10px 0;
  cursor: pointer;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin-top: 45px;
}

.hidden { display: none !important; }

@media (max-width: 500px) {
  header h1 { font-size: 26px; }
  .article { padding: 17px; }
  #detail { padding: 18px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <a class="back" href="/">← 返回综合站</a>
  <h1>个人博客</h1>
  <p>记录想法、技术、生活与值得保存的信息。</p>
</header>

<div id="listPage">

  <div class="search-box">
    <input id="searchInput"
      type="search"
      placeholder="搜索文章标题、内容或分类……">
  </div>

  <div class="categories" id="categories"></div>

  <h2 class="section-title">文章列表</h2>

  <div id="statusMessage"
    style="font-size:13px;color:#817873;margin:10px 0;">
    正在加载文章……
  </div>

  <div class="article-list" id="articleList"></div>

</div>

<div id="detail">
  <button class="back-list" id="backButton">← 返回文章列表</button>
  <div id="detailCategory"></div>
  <h2 id="detailTitle"></h2>
  <div class="detail-meta" id="detailMeta"></div>
  <div class="detail-content" id="detailContent"></div>
</div>

<footer>
  逢坂大河ws的综合站
  <p>个人博客 · 独立记录 · 持续更新</p>
</footer>

</div>

<script>

// 原有示例文章
const demoArticles = [
  {
    id: "demo-1",
    title: "欢迎来到逢坂大河ws的综合站",
    category: "本站公告",
    date: "2026-10-31",
    summary: "这是本站博客系统的第一篇示例文章，介绍网站的定位与未来规划。",
    content: `欢迎来到逢坂大河ws的综合站。

这里是一个个人网站，主要用于记录个人想法、整理资料、分享技术与保存值得记录的信息。

目前网站正在逐步建设中。

未来计划增加：
博客文章系统
人物资料库
九宫格图片工具
更多实用工具

本站会持续更新。`
  },
  {
    id: "demo-2",
    title: "为什么建立自己的个人网站",
    category: "个人记录",
    date: "2026-10-31",
    summary: "个人网站不仅是展示页面，也是一种独立保存和组织信息的方式。",
    content: `互联网有很多平台，但个人内容往往受到平台规则和展示方式的限制。

建立独立网站，可以自己决定页面结构、内容分类和功能。

这也是建立本站的一个重要原因。`
  },
  {
    id: "demo-3",
    title: "从 HTML 开始学习网站开发",
    category: "技术",
    date: "2026-10-31",
    summary: "从 HTML、CSS 到 JavaScript，逐步理解网站的基本组成。",
    content: `HTML 负责网页结构。

CSS 负责网页样式。

JavaScript 负责网页交互。

这三个部分是前端开发的重要基础。

本站也会逐步使用这些技术进行开发。`
  }
];

let articles = [...demoArticles];
let currentCategory = "全部";
let currentSearch = "";

const categoryBox = document.getElementById("categories");
const articleList = document.getElementById("articleList");
const listPage = document.getElementById("listPage");
const detail = document.getElementById("detail");
const statusMessage = document.getElementById("statusMessage");

// 日期格式处理
function formatDate(value) {
  if (!value) return "日期未知";
  return String(value).slice(0, 10);
}

// 数据库文章转换
function convertArticles(posts) {
  return posts.map(post => ({
    id: String(post.id),
    title: post.title || "无标题",
    category: post.category || "未分类",
    date: formatDate(post.created_at),
    summary: post.summary || "",
    content: post.content || ""
  }));
}

// 从 D1 数据库读取文章
async function loadArticles() {
  statusMessage.textContent = "正在从数据库读取文章……";

  try {
    const response = await fetch("/api/posts", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("API 请求失败");
    }

    const data = await response.json();

    if (!data.success || !Array.isArray(data.posts)) {
      throw new Error("数据格式错误");
    }

    if (data.posts.length > 0) {
      articles = convertArticles(data.posts);

      statusMessage.textContent =
        "已连接数据库 · 共 " + articles.length + " 篇文章";

    } else {
      articles = [...demoArticles];

      statusMessage.textContent =
        "数据库已连接，目前暂无已发布文章，正在显示示例文章。";
    }

  } catch (error) {
    articles = [...demoArticles];

    statusMessage.textContent =
      "暂时无法读取数据库，当前显示的是示例文章。";

    console.error("博客数据库读取失败：", error);
  }

  currentCategory = "全部";

  renderCategories();
  renderArticles();

  // 支持通过网址直接打开文章
  const initialId = new URLSearchParams(
    window.location.search
  ).get("article");

  if (initialId) {
    openArticle(initialId, false);
  }
}

// 获取分类
function getCategories() {
  return [
    "全部",
    ...new Set(articles.map(article => article.category))
  ];
}

// 渲染分类按钮
function renderCategories() {
  categoryBox.innerHTML = "";

  getCategories().forEach(category => {
    const button = document.createElement("button");

    button.className =
      "category" +
      (category === currentCategory ? " active" : "");

    button.textContent = category;

    button.onclick = () => {
      currentCategory = category;
      renderCategories();
      renderArticles();
    };

    categoryBox.appendChild(button);
  });
}

// 渲染文章列表
function renderArticles() {
  articleList.innerHTML = "";

  const keyword = currentSearch.toLowerCase();

  const filtered = articles.filter(article => {
    const categoryMatch =
      currentCategory === "全部" ||
      article.category === currentCategory;

    const searchMatch = [
      article.title,
      article.summary,
      article.content,
      article.category
    ].some(value =>
      String(value).toLowerCase().includes(keyword)
    );

    return categoryMatch && searchMatch;
  });

  if (filtered.length === 0) {
    articleList.innerHTML =
      '<div class="empty">没有找到相关文章。</div>';
    return;
  }

  filtered.forEach(article => {
    const card = document.createElement("article");
    card.className = "article";

    const category = document.createElement("span");
    category.className = "article-category";
    category.textContent = article.category;

    const title = document.createElement("h2");
    title.textContent = article.title;

    const summary = document.createElement("p");
    summary.textContent = article.summary;

    const meta = document.createElement("div");
    meta.className = "article-meta";
    meta.textContent = "发布时间：" + article.date;

    card.append(category, title, summary, meta);

    card.onclick = () => openArticle(article.id, true);

    articleList.appendChild(card);
  });
}

// 显示文章详情
function showArticle(article) {
  if (!article) return;

  listPage.classList.add("hidden");
  detail.style.display = "block";

  document.getElementById("detailCategory").textContent =
    article.category;

  document.getElementById("detailTitle").textContent =
    article.title;

  document.getElementById("detailMeta").textContent =
    "发布时间：" + article.date;

  document.getElementById("detailContent").textContent =
    article.content;

  window.scrollTo({ top: 0, behavior: "smooth" });
}

// 打开文章
function openArticle(id, updateHistory = true) {
  const article = articles.find(
    item => String(item.id) === String(id)
  );

  if (!article) return;

  showArticle(article);

  if (updateHistory) {
    const url = new URL(window.location.href);
    url.searchParams.set("article", id);

    history.pushState(
      { articleId: String(id) },
      "",
      url.pathname + url.search
    );
  }
}

// 返回文章列表
function backToList(updateHistory = true) {
  detail.style.display = "none";
  listPage.classList.remove("hidden");

  if (updateHistory) {
    const url = new URL(window.location.href);
    url.searchParams.delete("article");

    history.pushState(
      {},
      "",
      url.pathname + url.search
    );
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
}

// 返回按钮
document.getElementById("backButton").onclick = () => {
  backToList(true);
};

// 搜索
document.getElementById("searchInput").addEventListener(
  "input",
  event => {
    currentSearch = event.target.value.trim();
    renderArticles();
  }
);

// 浏览器前进和后退
window.addEventListener("popstate", () => {
  const articleId = new URLSearchParams(
    window.location.search
  ).get("article");

  if (articleId) {
    openArticle(articleId, false);
  } else {
    backToList(false);
  }
});

// 启动博客
loadArticles();

</script>
</body>
</html>
