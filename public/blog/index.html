<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff7f3">
<meta name="description" content="荷萌 HEMENG 个人博客，记录想法、技术、生活与值得保存的信息。">
<title>博客 - 荷萌 HEMENG</title>

<style>
:root {
  --bg: #fffaf7;
  --card: #ffffff;
  --cream: #fff7f3;
  --pink: #ffe8e0;
  --pink-deep: #f5c8c0;
  --text: #493735;
  --muted: #95827c;
  --accent: #b77b70;
  --accent-dark: #956258;
  --border: #f0e3de;
  --shadow: 0 12px 35px rgba(120,75,65,.07);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  padding: 0 16px 55px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}
a { color: inherit; text-decoration: none; }
.container { max-width: 920px; margin: auto; }
.site-header {
  max-width: 920px;
  margin: auto;
  padding: 20px 0 0;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 13px 17px;
  background: rgba(255,255,255,.82);
  border: 1px solid var(--border);
  border-radius: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-icon {
  width: 43px;
  height: 43px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: var(--pink);
  border: 1px solid #f2d8d0;
}
.brand-icon img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  padding: 3px;
}
.brand-name { font-weight: 800; font-size: 18px; letter-spacing: 1px; }
.brand-en { color: var(--muted); font-size: 9px; letter-spacing: 2.5px; margin-top: 2px; }
.back {
  color: var(--accent-dark);
  font-size: 13px;
  padding: 9px 13px;
  border-radius: 9px;
  background: var(--cream);
  border: 1px solid var(--border);
}
header.page-heading { padding: 43px 4px 23px; }
.eyebrow { color: var(--accent); font-size: 11px; letter-spacing: 3px; font-weight: 700; }
header.page-heading h1 { font-size: clamp(29px,5vw,39px); margin: 12px 0 8px; }
header.page-heading p { color: var(--muted); font-size: 14px; line-height: 1.9; margin: 0; }
.search-box { margin: 14px 0 18px; }
.search-box input {
  width: 100%;
  padding: 15px 17px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: white;
  font-size: 14px;
  color: var(--text);
  outline: none;
  box-shadow: 0 4px 15px rgba(120,75,65,.025);
}
.search-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(183,123,112,.10);
}
.categories { display: flex; flex-wrap: wrap; gap: 9px; margin: 18px 0 27px; }
.category {
  padding: 9px 15px;
  border: 1px solid var(--border);
  border-radius: 22px;
  background: white;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  transition: .2s;
}
.category:hover { border-color: var(--pink-deep); color: var(--accent-dark); }
.category.active { background: var(--accent); color: white; border-color: var(--accent); }
.section-title { font-size: 19px; margin: 29px 0 15px; }
.section-title::before {
  content: "";
  display: inline-block;
  width: 4px;
  height: 17px;
  border-radius: 5px;
  background: var(--accent);
  margin-right: 10px;
  vertical-align: -2px;
}
#statusMessage { font-size: 12px; color: var(--muted); margin: 10px 0 15px; }
.article-list { display: grid; gap: 14px; }
.article {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 22px 23px;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s, border-color .2s;
}
.article:hover {
  transform: translateY(-2px);
  border-color: var(--pink-deep);
  box-shadow: var(--shadow);
}
.article-category {
  display: inline-block;
  color: var(--accent-dark);
  background: var(--cream);
  border: 1px solid #f3e4df;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 11px;
}
.article h2 { font-size: 18px; margin: 13px 0 8px; line-height: 1.6; }
.article p { font-size: 13px; color: var(--muted); line-height: 1.9; margin: 0 0 13px; }
.article-meta { color: #aa9690; font-size: 11px; }
.empty {
  background: white;
  border: 1px dashed var(--pink-deep);
  border-radius: 13px;
  padding: 38px 15px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}
#detail {
  display: none;
  background: white;
  padding: 27px;
  border-radius: 17px;
  border: 1px solid var(--border);
  margin-top: 20px;
  box-shadow: var(--shadow);
}
#detail h2 { font-size: 26px; line-height: 1.55; margin: 15px 0; }
.detail-meta { color: var(--muted); font-size: 12px; margin: 12px 0 25px; }
.detail-content {
  font-size: 15px;
  line-height: 2.1;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.detail-content p { margin: 0 0 16px; }
.back-list {
  color: var(--accent-dark);
  border: 1px solid var(--border);
  background: var(--cream);
  padding: 9px 13px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 12px;
}
footer {
  text-align: center;
  color: #aa9690;
  font-size: 11px;
  margin-top: 55px;
  line-height: 2.2;
}
.footer-brand { color: var(--accent-dark); font-weight: 800; letter-spacing: 1px; }
.hidden { display: none !important; }
@media (max-width: 550px) {
  body { padding: 0 13px 40px; }
  .site-header { padding-top: 13px; }
  .topbar { padding: 11px 12px; }
  header.page-heading { padding: 35px 3px 20px; }
  header.page-heading h1 { font-size: 29px; }
  .article { padding: 18px; }
  #detail { padding: 19px; }
  #detail h2 { font-size: 22px; }
}
</style>
</head>

<body>
<div class="container">

<div class="site-header">
  <div class="topbar">
    <a class="brand" href="/" aria-label="荷萌首页">
      <div class="brand-icon">
        <img src="/images/hemeng-logo.svg" alt="荷萌 HEMENG">
      </div>
      <div>
        <div class="brand-name">荷萌</div>
        <div class="brand-en">HEMENG</div>
      </div>
    </a>
    <a class="back" href="/">← 返回荷萌首页</a>
  </div>
</div>

<header class="page-heading">
  <div class="eyebrow">HEMENG · BLOG</div>
  <h1>个人博客</h1>
  <p>记录想法、技术、生活与值得保存的信息。<br>把值得留下的内容，慢慢整理成自己的空间。</p>
</header>

<div id="listPage">
  <div class="search-box">
    <input id="searchInput" type="search" placeholder="搜索文章标题、内容或分类……">
  </div>
  <div class="categories" id="categories"></div>
  <h2 class="section-title">文章列表</h2>
  <div id="statusMessage">正在加载文章……</div>
  <div class="article-list" id="articleList"></div>
</div>

<div id="detail">
  <button class="back-list" id="backButton">← 返回文章列表</button>
  <div id="detailCategory" style="margin-top:20px"></div>
  <h2 id="detailTitle"></h2>
  <div class="detail-meta" id="detailMeta"></div>
  <div class="detail-content" id="detailContent"></div>
</div>

<footer>
  <div class="footer-brand">荷萌 HEMENG</div>
  个人博客 · 独立记录 · 持续更新
</footer>

</div>

<script>
const demoArticles = [
  {
    id: "demo-1",
    title: "欢迎来到荷萌 HEMENG",
    category: "本站公告",
    date: "2026-10-31",
    summary: "这是本站博客系统的第一篇示例文章，介绍网站的定位与未来规划。",
    content: `欢迎来到荷萌 HEMENG。

这里是一个个人网站，主要用于记录个人想法、整理资料、分享技术与保存值得记录的信息。

目前网站正在逐步建设中。

未来计划增加：
思维导图生成
设备信息查询
更多实用工具

本站会持续更新。`
  },
  {
    id: "demo-2",
    title: "为什么建立自己的个人网站",
    category: "个人记录",
    date: "2026-10-31",
    summary: "个人网站不仅是展示页面，也是一种独立保存和组织信息的方式。",
    content: `互联网有很多平台，但个人内容往往受到平台规则和展示方式的限制。

建立独立网站，可以自己决定页面结构、内容分类和功能。

这也是建立本站的一个重要原因。`
  },
  {
    id: "demo-3",
    title: "从 HTML 开始学习网站开发",
    category: "技术",
    date: "2026-10-31",
    summary: "从 HTML、CSS 到 JavaScript，逐步理解网站的基本组成。",
    content: `HTML 负责网页结构。

CSS 负责网页样式。

JavaScript 负责网页交互。

这三个部分是前端开发的重要基础。

本站也会逐步使用这些技术进行开发。`
  }
];

let articles = [...demoArticles];
let currentCategory = "全部";
let currentSearch = "";

const categoryBox = document.getElementById("categories");
const articleList = document.getElementById("articleList");
const listPage = document.getElementById("listPage");
const detail = document.getElementById("detail");
const statusMessage = document.getElementById("statusMessage");

function formatDate(value) {
  if (!value) return "日期未知";
  return String(value).slice(0, 10);
}

function convertArticles(posts) {
  return posts.map(post => ({
    id: String(post.id),
    title: post.title || "无标题",
    category: post.category || "未分类",
    date: formatDate(post.created_at),
    summary: post.summary || "",
    content: post.content || ""
  }));
}

async function loadArticles() {
  statusMessage.textContent = "正在从数据库读取文章……";

  try {
    const response = await fetch("/api/posts", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("API 请求失败");
    }

    const data = await response.json();

    if (!data.success || !Array.isArray(data.posts)) {
      throw new Error("数据格式错误");
    }

    if (data.posts.length > 0) {
      articles = convertArticles(data.posts);
      statusMessage.textContent =
        "已连接数据库 · 共 " + articles.length + " 篇文章";
    } else {
      articles = [...demoArticles];
      statusMessage.textContent =
        "数据库已连接，目前暂无已发布文章，正在显示示例文章。";
    }

  } catch (error) {
    articles = [...demoArticles];
    statusMessage.textContent =
      "暂时无法读取数据库，当前显示的是示例文章。";
    console.error("博客数据库读取失败：", error);
  }

  currentCategory = "全部";
  renderCategories();
  renderArticles();

  const initialId = new URLSearchParams(
    window.location.search
  ).get("article");

  if (initialId) {
    openArticle(initialId, false);
  }
}

function getCategories() {
  return [
    "全部",
    ...new Set(articles.map(article => article.category))
  ];
}

function renderCategories() {
  categoryBox.innerHTML = "";

  getCategories().forEach(category => {
    const button = document.createElement("button");

    button.className =
      "category" +
      (category === currentCategory ? " active" : "");

    button.textContent = category;

    button.onclick = () => {
      currentCategory = category;
      renderCategories();
      renderArticles();
    };

    categoryBox.appendChild(button);
  });
}

function renderArticles() {
  articleList.innerHTML = "";

  const keyword = currentSearch.toLowerCase();

  const filtered = articles.filter(article => {
    const categoryMatch =
      currentCategory === "全部" ||
      article.category === currentCategory;

    const searchMatch = [
      article.title,
      article.summary,
      article.content,
      article.category
    ].some(value =>
      String(value).toLowerCase().includes(keyword)
    );

    return categoryMatch && searchMatch;
  });

  if (filtered.length === 0) {
    articleList.innerHTML =
      '<div class="empty">没有找到相关文章。</div>';
    return;
  }

  filtered.forEach(article => {
    const card = document.createElement("article");
    card.className = "article";

    const category = document.createElement("span");
    category.className = "article-category";
    category.textContent = article.category;

    const title = document.createElement("h2");
    title.textContent = article.title;

    const summary = document.createElement("p");
    summary.textContent = article.summary;

    const meta = document.createElement("div");
    meta.className = "article-meta";
    meta.textContent = "发布时间：" + article.date;

    card.append(category, title, summary, meta);
    card.onclick = () => openArticle(article.id, true);

    articleList.appendChild(card);
  });
}

function showArticle(article) {
  if (!article) return;

  listPage.classList.add("hidden");
  detail.style.display = "block";

  document.getElementById("detailCategory").textContent =
    article.category;

  document.getElementById("detailTitle").textContent =
    article.title;

  document.getElementById("detailMeta").textContent =
    "发布时间：" + article.date;

  document.getElementById("detailContent").textContent =
    article.content;

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openArticle(id, updateHistory = true) {
  const article = articles.find(
    item => String(item.id) === String(id)
  );

  if (!article) return;

  showArticle(article);

  if (updateHistory) {
    const url = new URL(window.location.href);
    url.searchParams.set("article", id);

    history.pushState(
      { articleId: String(id) },
      "",
      url.pathname + url.search
    );
  }
}

function backToList(updateHistory = true) {
  detail.style.display = "none";
  listPage.classList.remove("hidden");

  if (updateHistory) {
    const url = new URL(window.location.href);
    url.searchParams.delete("article");

    history.pushState(
      {},
      "",
      url.pathname + url.search
    );
  }

  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("backButton").onclick = () => {
  backToList(true);
};

document.getElementById("searchInput").addEventListener(
  "input",
  event => {
    currentSearch = event.target.value.trim();
    renderArticles();
  }
);

window.addEventListener("popstate", () => {
  const articleId = new URLSearchParams(
    window.location.search
  ).get("article");

  if (articleId) {
    openArticle(articleId, false);
  } else {
    backToList(false);
  }
});

loadArticles();
</script>

<script src="/js/i18n.js"></script>
<script src="/js/blog-i18n.js"></script>

</body>
</html>
<link rel="stylesheet" href="/css/comic-world.css?v=20261113-1">
