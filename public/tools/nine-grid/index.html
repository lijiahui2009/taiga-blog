
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九宫格图片工具 - 逢坂大河ws的综合站</title>

<style>
:root {
  --bg: #f7f5f3;
  --card: #ffffff;
  --text: #302b29;
  --muted: #817873;
  --accent: #b77b70;
  --border: #e9e2de;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 16px 60px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
}

header {
  text-align: center;
  padding: 30px 10px;
}

header h1 {
  font-size: 28px;
  margin: 0 0 10px;
}

header p {
  color: var(--muted);
  font-size: 14px;
}

.back {
  color: var(--accent);
  text-decoration: none;
  font-size: 14px;
}

.tabs {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

.tab {
  flex: 1;
  padding: 14px 8px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 12px;
  color: var(--text);
  font-size: 15px;
  cursor: pointer;
}

.tab.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.card {
  background: var(--card);
  padding: 22px;
  border-radius: 16px;
  border: 1px solid var(--border);
  margin-bottom: 18px;
}

h2 {
  font-size: 19px;
  margin: 0 0 10px;
}

.desc {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 18px;
}

label {
  display: block;
  font-size: 14px;
  margin-bottom: 8px;
}

input, select {
  max-width: 100%;
  font-size: 14px;
}

input[type="file"] {
  width: 100%;
  padding: 12px;
  background: #faf9f8;
  border: 1px dashed #d8ccc5;
  border-radius: 10px;
}

select {
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
}

button {
  border: 0;
  background: var(--accent);
  color: white;
  padding: 12px 18px;
  border-radius: 9px;
  font-size: 14px;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

button.secondary {
  background: #eee9e6;
  color: var(--text);
}

.settings {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  align-items: center;
  margin: 18px 0;
}

.settings label {
  margin: 0;
}

.preview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  margin-top: 18px;
}

.preview img,
.preview canvas {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  background: #eee;
  border-radius: 5px;
}

.preview-item {
  min-width: 0;
}

.preview-item button {
  width: 100%;
  padding: 8px 2px;
  margin-top: 5px;
  font-size: 12px;
}

.image-slots {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.slot {
  min-width: 0;
  text-align: center;
}

.slot-number {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 7px;
}

.slot img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  background: #eee;
  border-radius: 8px;
  display: block;
  margin-bottom: 7px;
}

.slot input {
  width: 100%;
  font-size: 11px;
}

.status {
  font-size: 13px;
  color: var(--muted);
  margin-top: 14px;
  line-height: 1.6;
}

.result-image {
  width: 100%;
  max-width: 500px;
  display: block;
  margin: 20px auto;
  border-radius: 8px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 16px;
}

.hidden { display: none; }

footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin-top: 35px;
}

@media (max-width: 480px) {
  body { padding: 12px 10px 40px; }
  .card { padding: 16px; }
  header h1 { font-size: 24px; }
  .image-slots { gap: 8px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <a class="back" href="/">← 返回综合站</a>
  <h1>九宫格图片工具</h1>
  <p>图片切割与九宫格合成，一站完成</p>
</header>

<div class="tabs">
  <button class="tab active" id="cutTab">图片切割</button>
  <button class="tab" id="mergeTab">图片合成</button>
</div>

<!-- 图片切割 -->
<section id="cutSection">

<div class="card">
  <h2>一张图片切成九张</h2>
  <p class="desc">
    上传一张图片，自动切割成 3×3 九张图片。
    可以逐张预览和下载。
  </p>

  <label>选择图片</label>
  <input type="file" id="cutInput"
    accept="image/png,image/jpeg,image/webp">

  <div class="settings">
    <label>
      切割方式
      <select id="cropMode">
        <option value="square">中心裁切为正方形</option>
        <option value="original">保留原图比例</option>
      </select>
    </label>

    <label>
      图片格式
      <select id="cutFormat">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPG</option>
        <option value="image/webp">WEBP</option>
      </select>
    </label>
  </div>

  <button id="cutButton">开始切割</button>
  <div class="status" id="cutStatus">等待上传图片。</div>
  <div class="preview" id="cutPreview"></div>
</div>

</section>

<!-- 九张图片合成 -->
<section id="mergeSection" class="hidden">

<div class="card">
  <h2>九张图片合成一张</h2>
  <p class="desc">
    按照 1 至 9 的顺序上传图片。
    系统会将九张图片排列成 3×3 九宫格，
    最终生成一张完整图片。
  </p>

  <div class="image-slots" id="imageSlots"></div>

  <div class="settings">
    <label>
      输出格式
      <select id="mergeFormat">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPG</option>
        <option value="image/webp">WEBP</option>
      </select>
    </label>

    <label>
      每格尺寸
      <select id="cellSize">
        <option value="300">300 × 300</option>
        <option value="500" selected>500 × 500</option>
        <option value="800">800 × 800</option>
        <option value="1000">1000 × 1000</option>
      </select>
    </label>
  </div>

  <button id="mergeButton">合成九宫格</button>
  <div class="status" id="mergeStatus">
    请依次上传九张图片。
  </div>

  <canvas id="mergeCanvas" class="result-image hidden"></canvas>

  <div class="actions">
    <button id="downloadMerge" disabled>下载合成图片</button>
    <button class="secondary" id="clearMerge">清空图片</button>
  </div>
</div>

</section>

<footer>
  逢坂大河ws的综合站 · 九宫格图片工具
  <p>图片仅在当前浏览器本地处理，不会上传服务器。</p>
</footer>

</div>

<script>
const cutTab = document.getElementById("cutTab");
const mergeTab = document.getElementById("mergeTab");
const cutSection = document.getElementById("cutSection");
const mergeSection = document.getElementById("mergeSection");

cutTab.onclick = () => {
  cutTab.classList.add("active");
  mergeTab.classList.remove("active");
  cutSection.classList.remove("hidden");
  mergeSection.classList.add("hidden");
};

mergeTab.onclick = () => {
  mergeTab.classList.add("active");
  cutTab.classList.remove("active");
  mergeSection.classList.remove("hidden");
  cutSection.classList.add("hidden");
};

// 图片切割
let cutCanvases = [];

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    const url = URL.createObjectURL(file);

    image.onload = () => {
      URL.revokeObjectURL(url);
      resolve(image);
    };

    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("图片读取失败"));
    };

    image.src = url;
  });
}

function canvasBlob(canvas, format) {
  return new Promise(resolve => {
    canvas.toBlob(resolve, format, 0.92);
  });
}

document.getElementById("cutButton").onclick =
async () => {
  const file = document.getElementById("cutInput").files[0];
  const status = document.getElementById("cutStatus");
  const preview = document.getElementById("cutPreview");

  if (!file) {
    status.textContent = "请先选择一张图片。";
    return;
  }

  if (file.size > 20 * 1024 * 1024) {
    status.textContent = "图片不能超过 20MB。";
    return;
  }

  try {
    status.textContent = "正在处理图片……";
    preview.innerHTML = "";
    cutCanvases = [];

    const img = await loadImage(file);
    const mode = document.getElementById("cropMode").value;
    const format = document.getElementById("cutFormat").value;

    let width = img.width;
    let height = img.height;
    let startX = 0;
    let startY = 0;

    if (mode === "square") {
      const side = Math.min(width, height);
      startX = (width - side) / 2;
      startY = (height - side) / 2;
      width = side;
      height = side;
    }

    const cellW = width / 3;
    const cellH = height / 3;

    for (let i = 0; i < 9; i++) {
      const row = Math.floor(i / 3);
      const col = i % 3;

      const canvas = document.createElement("canvas");
      canvas.width = Math.round(cellW);
      canvas.height = Math.round(cellH);

      const ctx = canvas.getContext("2d");

      ctx.drawImage(
        img,
        startX + col * cellW,
        startY + row * cellH,
        cellW,
        cellH,
        0,
        0,
        canvas.width,
        canvas.height
      );

      cutCanvases.push(canvas);

      const item = document.createElement("div");
      item.className = "preview-item";

      item.appendChild(canvas);

      const button = document.createElement("button");
      button.textContent = "下载第 " + (i + 1) + " 张";

      button.onclick = async () => {
        const blob = await canvasBlob(canvas, format);
        if (!blob) {
          status.textContent = "图片导出失败。";
          return;
        }
        downloadBlob(blob, "九宫格-" + (i + 1) + "." + getExtension(format));
      };

      item.appendChild(button);
      preview.appendChild(item);
    }

    status.textContent = "切割完成！共生成 9 张图片。";

  } catch (error) {
    status.textContent = "处理失败：" + error.message;
  }
};

// 创建九个图片上传位置
const slots = document.getElementById("imageSlots");
const mergeImages = Array(9).fill(null);

for (let i = 0; i < 9; i++) {
  const slot = document.createElement("div");
  slot.className = "slot";

  const number = document.createElement("div");
  number.className = "slot-number";
  number.textContent = "第 " + (i + 1) + " 张";

  const img = document.createElement("img");
  img.alt = "图片预览";

  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/png,image/jpeg,image/webp";

  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;

    if (file.size > 20 * 1024 * 1024) {
      input.value = "";
      document.getElementById("mergeStatus").textContent =
        "单张图片不能超过 20MB。";
      return;
    }

    try {
      const image = await loadImage(file);
      mergeImages[i] = image;
      img.src = image.src;
      document.getElementById("mergeStatus").textContent =
        "已选择 " + mergeImages.filter(Boolean).length + " / 9 张图片。";
      document.getElementById("downloadMerge").disabled = true;
    } catch {
      document.getElementById("mergeStatus").textContent =
        "第 " + (i + 1) + " 张图片读取失败。";
    }
  };

  slot.appendChild(number);
  slot.appendChild(img);
  slot.appendChild(input);
  slots.appendChild(slot);
}

// 图片合成
document.getElementById("mergeButton").onclick = async () => {
  const status = document.getElementById("mergeStatus");
  const canvas = document.getElementById("mergeCanvas");
  const downloadButton = document.getElementById("downloadMerge");

  if (mergeImages.some(image => !image)) {
    status.textContent = "请先上传完整的九张图片。";
    return;
  }

  const size = Number(document.getElementById("cellSize").value);
  const ctx = canvas.getContext("2d");

  canvas.width = size * 3;
  canvas.height = size * 3;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < 9; i++) {
    const row = Math.floor(i / 3);
    const col = i % 3;
    const img = mergeImages[i];

    // 将每张图片中心裁切为正方形
    const side = Math.min(img.width, img.height);
    const sx = (img.width - side) / 2;
    const sy = (img.height - side) / 2;

    ctx.drawImage(
      img,
      sx, sy, side, side,
      col * size, row * size, size, size
    );
  }

  canvas.classList.remove("hidden");
  downloadButton.disabled = false;
  status.textContent = "合成成功！最终图片尺寸：" +
    canvas.width + " × " + canvas.height + "。";
};

// 下载合成图片
document.getElementById("downloadMerge").onclick =
async () => {
  const format = document.getElementById("mergeFormat").value;
  const canvas = document.getElementById("mergeCanvas");
  const blob = await canvasBlob(canvas, format);

  if (!blob) {
    document.getElementById("mergeStatus").textContent =
      "图片导出失败，请尝试其他格式。";
    return;
  }

  downloadBlob(blob, "九宫格合成." + getExtension(format));
};

// 清空合成图片
document.getElementById("clearMerge").onclick = () => {
  mergeImages.fill(null);

  document.querySelectorAll("#imageSlots input").forEach(input => {
    input.value = "";
  });

  document.querySelectorAll("#imageSlots img").forEach(img => {
    img.removeAttribute("src");
  });

  const canvas = document.getElementById("mergeCanvas");
  canvas.classList.add("hidden");

  document.getElementById("downloadMerge").disabled = true;
  document.getElementById("mergeStatus").textContent =
    "已清空，请重新上传九张图片。";
};

function getExtension(format) {
  if (format === "image/jpeg") return "jpg";
  if (format === "image/webp") return "webp";
  return "png";
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
</script>

</body>
</html>
