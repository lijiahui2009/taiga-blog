<style>
:root {
  --bg: #FFF7F3;
  --card: #FFFFFF;
  --soft: #FFF0EA;

  --muted: #8B7C76;
  --accent: #B77B70;

  --border: #F0E3DE;

}

* {

}

body {
  margin: 0;

  padding: 45px 18px;
  display: flex;
  align-items: center;

}

.container {

.eyebrow::before {

h1 {

.description {

.content {

<body>

<main class="container">

  <header class="brand">
    <a class="logo" href="/" aria-label="荷萌 HEMENG 首页">
      <img src="/images/hemeng-logo.svg" alt="荷萌 HEMENG">
    </a>
    <div class="brand-label">PERSONAL SPACE</div>
  </header>

  <section class="card">

    <div class="eyebrow">HEMENG · SHARE</div>

    <h1>分享内容</h1>

    <div class="description">
      有人通过荷萌分享了这段内容。
      <br>
      你可以在这里查看，也可以复制保存。
    </div>

    <div id="status" class="status" role="status" aria-live="polite">
      正在读取分享内容……
    </div>

    <div id="shareTime" class="share-time" hidden>
      <div class="share-time-title">分享时间信息</div>

      <div class="time-row">
        <span class="time-label">创作时间</span>
        <span class="time-value" id="createdAt">--</span>
      </div>

      <div class="time-row">
        <span class="time-label">到期时间</span>
        <span class="time-value" id="expiresAt">--</span>
      </div>

      <div class="time-row">
        <span class="time-label">剩余有效时间</span>
        <span class="countdown" id="countdown">--</span>
      </div>
    </div>

    <div id="content" class="content" hidden></div>

    <div class="actions" id="actions" hidden>
      <button id="copyBtn" type="button">复制内容</button>
      <a class="home" href="/">返回荷萌首页</a>
    </div>

  </section>

  <footer class="footer">
    内容由分享者提供，请自行判断其真实性。
    <br>
    分享链接有效期为 30 天。
    <br>
    © 2026 <a href="/">HEMENG 荷萌</a>
  </footer>

</main>

<script>
const statusEl = document.getElementById("status");
const contentEl = document.getElementById("content");
const actionsEl = document.getElementById("actions");
const copyBtn = document.getElementById("copyBtn");

const shareTimeEl = document.getElementById("shareTime");
const createdAtEl = document.getElementById("createdAt");
const expiresAtEl = document.getElementById("expiresAt");
const countdownEl = document.getElementById("countdown");

let sharedContent = "";
let shareExpiresAt = 0;
let serverTimeOffset = 0;
let countdownTimer = null;

/* 显示错误 */
function showError(message) {
  statusEl.textContent = message;
  statusEl.classList.add("error");
  statusEl.hidden = false;

  contentEl.hidden = true;
  actionsEl.hidden = true;
  shareTimeEl.hidden = true;

  stopCountdown();
}

/* 格式化时间 */
function formatShareTime(timestamp) {
  if (!timestamp) return "--";

  const date = new Date(timestamp * 1000);

  if (Number.isNaN(date.getTime())) return "--";

  return date.toLocaleString("zh-CN", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  });
}

/* 停止倒计时 */
function stopCountdown() {
  if (countdownTimer !== null) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }
}

/* 更新倒计时 */
function updateCountdown() {
  if (!shareExpiresAt) return;

  const now = (Date.now() + serverTimeOffset) / 1000;

  const remaining = Math.max(
    0,
    Math.floor(shareExpiresAt - now)
  );

  if (remaining <= 0) {
    countdownEl.textContent = "已过期";
    countdownEl.classList.add("expired");
    stopCountdown();
    return;
  }

  countdownEl.classList.remove("expired");

  const days = Math.floor(remaining / 86400);
  const hours = Math.floor((remaining % 86400) / 3600);
  const minutes = Math.floor((remaining % 3600) / 60);
  const seconds = remaining % 60;

  countdownEl.textContent =
    `${days}天 ${String(hours).padStart(2, "0")}:` +
    `${String(minutes).padStart(2, "0")}:` +
    `${String(seconds).padStart(2, "0")}`;
}

/* 设置分享时间 */
function setupShareTime(data) {
  if (
    !data.createdAt ||
    !data.expiresAt ||
    !data.serverNow
  ) {
    shareTimeEl.hidden = true;
    return;
  }

  stopCountdown();

  shareExpiresAt = data.expiresAt;

  // 使用服务器时间校准本地设备时间
  serverTimeOffset = (data.serverNow * 1000) - Date.now();

  createdAtEl.textContent = formatShareTime(data.createdAt);
  expiresAtEl.textContent = formatShareTime(data.expiresAt);

  shareTimeEl.hidden = false;

  updateCountdown();

  countdownTimer = setInterval(updateCountdown, 1000);
}

/* 读取分享 */
/* 读取分享：超时保护与自动重试 */
async function loadShare() {
  const id = new URLSearchParams(location.search).get("id");

  if (!id || !/^[a-f0-9]{32}$/.test(id)) {
    showError("分享链接无效，请检查二维码或链接。");
    return;
  }

  const maxAttempts = 3;
  const timeoutMs = 10000;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    const controller = new AbortController();
    let timedOut = false;

    const timeout = setTimeout(() => {
      timedOut = true;
      controller.abort();
    }, timeoutMs);

    try {
      if (attempt > 1) {
        statusEl.textContent =
          `连接不稳定，正在重试（${attempt - 1}/${maxAttempts - 1}）……`;
        statusEl.hidden = false;
        statusEl.classList.remove("error");
      }

      const response = await fetch(
        `/api/qr-shares?id=${encodeURIComponent(id)}`,
        {
          cache: "no-store",
          signal: controller.signal
        }
      );

      const data = await response.json();

      if (response.status >= 500 || response.status === 429) {
        throw new Error("服务器暂时繁忙");
      }

      if (!response.ok || !data.success) {
        showError(data.message || "内容不存在或已经过期。");
        return;
      }

      if (typeof data.content !== "string") {
        showError("分享内容格式异常，暂时无法显示。");
        return;
      }

      sharedContent = data.content;

      contentEl.textContent = sharedContent;
      contentEl.hidden = false;

      statusEl.hidden = true;
      actionsEl.hidden = false;

      setupShareTime(data);
      return;

    } catch (error) {
      if (attempt === maxAttempts) {
        showError(
          timedOut
            ? "连接超时，服务器暂时没有响应。请稍后刷新重试。"
            : "网络连接不稳定，暂时无法读取分享内容。请稍后刷新重试。"
        );
        return;
      }

    } finally {
      clearTimeout(timeout);
    }
  }
}
/* 复制内容 */
copyBtn.addEventListener("click", async () => {
  if (!sharedContent) return;

  try {
    await navigator.clipboard.writeText(sharedContent);

    copyBtn.textContent = "已复制";
    copyBtn.disabled = true;

    setTimeout(() => {
      copyBtn.textContent = "复制内容";
      copyBtn.disabled = false;
    }, 1800);

  } catch {
    copyBtn.textContent = "复制失败，请手动选择文字";
    copyBtn.disabled = false;
  }
});

/* 页面离开时清理倒计时 */
window.addEventListener("pagehide", stopCountdown);

loadShare();
</script>

<script>
window.addEventListener("error", function(event) {
  console.error("[HEMENG Share] 页面脚本异常：", event.error || event.message);

  const status = document.getElementById("status");
  if (status) {
    status.textContent = "页面脚本发生异常，请刷新页面重试。";
    status.hidden = false;
    status.classList.add("error");
  }
});

window.addEventListener("unhandledrejection", function(event) {
  console.error("[HEMENG Share] 未处理的异步异常：", event.reason);

  const status = document.getElementById("status");
  if (status) {
    status.textContent = "页面初始化失败，请刷新页面重试。";
    status.hidden = false;
    status.classList.add("error");
  }
});

</script>
