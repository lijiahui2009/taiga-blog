
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF7F3">
<meta name="description" content="荷萌 HEMENG 分享内容页面">
<title>分享内容 - 荷萌 HEMENG</title>
  <link rel="stylesheet" href="/css/comic-tools.css?v=20261113-1">

<style>
:root {
  --bg: #FFF7F3;
  --card: #FFFFFF;
  --soft: #FFF0EA;
  --text: #493B38;
  --muted: #8B7C76;
  --accent: #B77B70;
  --accent-dark: #956258;
  --border: #F0E3DE;
  --shadow: 0 14px 42px rgba(80, 50, 40, .055);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 45px 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 85% 12%, rgba(255,232,224,.75), transparent 27%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
}

.brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 27px;
}

.logo {
  display: flex;
  align-items: center;
}

.logo img {
  display: block;
  width: auto;
  height: 45px;
  max-width: 190px;
  object-fit: contain;
}

.brand-label {
  color: var(--accent-dark);
  font-size: 11px;
  letter-spacing: 1.5px;
}

.card {
  padding: 35px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 21px;
  box-shadow: var(--shadow);
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2.5px;
}

.eyebrow::before {
  content: "";
  width: 22px;
  height: 1px;
  background: var(--accent);
}

h1 {
  margin: 17px 0 9px;
  font-size: 28px;
  font-weight: 650;
  letter-spacing: .5px;
}

.description {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.9;
}

.content {
  margin-top: 25px;
  padding: 23px;
  min-height: 135px;
  border-radius: 14px;
  background: #FFFBF9;
  border: 1px solid var(--border);
  color: #574944;
  font-size: 15px;
  line-height: 2;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  user-select: text;
}

.status {
  margin-top: 22px;
  padding: 24px 18px;
  color: var(--muted);
  background: #FFFBF9;
  border: 1px solid var(--border);
  border-radius: 13px;
  text-align: center;
  font-size: 13px;
  line-height: 1.9;
}

.status.error {
  color: #BD625C;
  background: #FFF8F6;
}

.share-time {
  margin-top: 18px;
  padding: 17px;
  background: #FFFBF9;
  border: 1px solid var(--border);
  border-radius: 13px;
}

.share-time-title {
  margin-bottom: 12px;
  color: var(--accent-dark);
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1px;
}

.time-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  flex-wrap: wrap;
  padding: 7px 0;
  font-size: 13px;
  line-height: 1.7;
}

.time-label {
  color: var(--muted);
}

.time-value {
  color: var(--text);
  font-weight: 700;
  text-align: right;
}

.countdown {
  color: var(--accent-dark);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: .03em;
}

.countdown.expired {
  color: #BD625C;
}

.actions {
  display: flex;
  gap: 12px;
  margin-top: 21px;
  flex-wrap: wrap;
}

button,
.home {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-height: 46px;
  padding: 0 21px;
  border: 0;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: background .2s, transform .2s;
}

button {
  color: white;
  background: var(--accent);
}

button:hover {
  background: var(--accent-dark);
}

button:active,
.home:active {
  transform: scale(.98);
}

.home {
  color: var(--accent-dark);
  background: var(--soft);
}

.home:hover {
  background: #F9DFD6;
}

button:disabled {
  opacity: .55;
  cursor: default;
}

.footer {
  margin-top: 25px;
  color: #A3958F;
  font-size: 11px;
  text-align: center;
  line-height: 2.1;
}

.footer a {
  color: var(--accent-dark);
  text-decoration: none;
}

[hidden] {
  display: none !important;
}

@media (max-width: 520px) {
  body {
    padding: 25px 14px;
    align-items: flex-start;
  }

  .container {
    margin-top: 12px;
  }

  .brand {
    margin-bottom: 22px;
  }

  .logo img {
    height: 40px;
  }

  .card {
    padding: 25px 19px;
    border-radius: 17px;
  }

  h1 {
    font-size: 24px;
  }

  .content {
    padding: 18px;
    font-size: 14px;
  }

  .actions {
    flex-direction: column;
  }

  button,
  .home {
    width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<main class="container">

  <header class="brand">
    <a class="logo" href="/" aria-label="荷萌 HEMENG 首页">
      <img src="/images/hemeng-logo.svg" alt="荷萌 HEMENG">
    </a>
    <div class="brand-label">PERSONAL SPACE</div>
  </header>

  <section class="card">

    <div class="eyebrow">HEMENG · SHARE</div>

    <h1>分享内容</h1>

    <div class="description">
      有人通过荷萌分享了这段内容。
      <br>
      你可以在这里查看，也可以复制保存。
    </div>

    <div id="status" class="status" role="status" aria-live="polite">
      正在读取分享内容……
    </div>

    <div id="shareTime" class="share-time" hidden>
      <div class="share-time-title">分享时间信息</div>

      <div class="time-row">
        <span class="time-label">创作时间</span>
        <span class="time-value" id="createdAt">--</span>
      </div>

      <div class="time-row">
        <span class="time-label">到期时间</span>
        <span class="time-value" id="expiresAt">--</span>
      </div>

      <div class="time-row">
        <span class="time-label">剩余有效时间</span>
        <span class="countdown" id="countdown">--</span>
      </div>
    </div>

    <div id="content" class="content" hidden></div>

    <div class="actions" id="actions" hidden>
      <button id="copyBtn" type="button">复制内容</button>
      <a class="home" href="/">返回荷萌首页</a>
    </div>

  </section>

  <footer class="footer">
    内容由分享者提供，请自行判断其真实性。
    <br>
    分享链接有效期为 30 天。
    <br>
    © 2026 <a href="/">HEMENG 荷萌</a>
  </footer>

</main>

<script>
const statusEl = document.getElementById("status");
const contentEl = document.getElementById("content");
const actionsEl = document.getElementById("actions");
const copyBtn = document.getElementById("copyBtn");

const shareTimeEl = document.getElementById("shareTime");
const createdAtEl = document.getElementById("createdAt");
const expiresAtEl = document.getElementById("expiresAt");
const countdownEl = document.getElementById("countdown");

let sharedContent = "";
let shareExpiresAt = 0;
let serverTimeOffset = 0;
let countdownTimer = null;

/* 显示错误 */
function showError(message) {
  statusEl.textContent = message;
  statusEl.classList.add("error");
  statusEl.hidden = false;

  contentEl.hidden = true;
  actionsEl.hidden = true;
  shareTimeEl.hidden = true;

  stopCountdown();
}

/* 格式化时间 */
function formatShareTime(timestamp) {
  if (!timestamp) return "--";

  const date = new Date(timestamp * 1000);

  if (Number.isNaN(date.getTime())) return "--";

  return date.toLocaleString("zh-CN", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  });
}

/* 停止倒计时 */
function stopCountdown() {
  if (countdownTimer !== null) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }
}

/* 更新倒计时 */
function updateCountdown() {
  if (!shareExpiresAt) return;

  const now = (Date.now() + serverTimeOffset) / 1000;

  const remaining = Math.max(
    0,
    Math.floor(shareExpiresAt - now)
  );

  if (remaining <= 0) {
    countdownEl.textContent = "已过期";
    countdownEl.classList.add("expired");
    stopCountdown();
    return;
  }

  countdownEl.classList.remove("expired");

  const days = Math.floor(remaining / 86400);
  const hours = Math.floor((remaining % 86400) / 3600);
  const minutes = Math.floor((remaining % 3600) / 60);
  const seconds = remaining % 60;

  countdownEl.textContent =
    `${days}天 ${String(hours).padStart(2, "0")}:` +
    `${String(minutes).padStart(2, "0")}:` +
    `${String(seconds).padStart(2, "0")}`;
}

/* 设置分享时间 */
function setupShareTime(data) {
  if (
    !data.createdAt ||
    !data.expiresAt ||
    !data.serverNow
  ) {
    shareTimeEl.hidden = true;
    return;
  }

  stopCountdown();

  shareExpiresAt = data.expiresAt;

  // 使用服务器时间校准本地设备时间
  serverTimeOffset = (data.serverNow * 1000) - Date.now();

  createdAtEl.textContent = formatShareTime(data.createdAt);
  expiresAtEl.textContent = formatShareTime(data.expiresAt);

  shareTimeEl.hidden = false;

  updateCountdown();

  countdownTimer = setInterval(updateCountdown, 1000);
}

/* 读取分享 */
async function loadShare() {
  const id = new URLSearchParams(location.search).get("id");

  if (!id || !/^[a-f0-9]{32}$/.test(id)) {
    showError("分享链接无效，请检查二维码或链接。");
    return;
  }

  try {
    const response = await fetch(
      `/api/qr-shares?id=${encodeURIComponent(id)}`,
      { cache: "no-store" }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      showError(data.message || "内容不存在或已经过期。");
      return;
    }

    if (typeof data.content !== "string") {
      showError("分享内容格式异常，暂时无法显示。");
      return;
    }

    sharedContent = data.content;

    contentEl.textContent = sharedContent;
    contentEl.hidden = false;

    statusEl.hidden = true;
    actionsEl.hidden = false;

    setupShareTime(data);

  } catch (error) {
    showError("网络连接失败，请稍后刷新重试。");
  }
}

/* 复制内容 */
copyBtn.addEventListener("click", async () => {
  if (!sharedContent) return;

  try {
    await navigator.clipboard.writeText(sharedContent);

    copyBtn.textContent = "已复制";
    copyBtn.disabled = true;

    setTimeout(() => {
      copyBtn.textContent = "复制内容";
      copyBtn.disabled = false;
    }, 1800);

  } catch {
    copyBtn.textContent = "复制失败，请手动选择文字";
    copyBtn.disabled = false;
  }
});

/* 页面离开时清理倒计时 */
window.addEventListener("pagehide", stopCountdown);

loadShare();
</script>
<script src="/js/i18n.js"></script>
<script src="/js/share-i18n.js"></script>
</body>
</html>
