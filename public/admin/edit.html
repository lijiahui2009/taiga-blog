
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7f3">
<title>编辑文章 - 荷萌 HEMENG</title>
<style>
:root {
  --bg:#fff7f3;
  --surface:#fff;
  --soft:#fff0eb;
  --pink:#f5c8c0;
  --accent:#b77b70;
  --text:#6d4c49;
  --muted:#956258;
  --line:#f0dfd9;
  --shadow:0 12px 35px rgba(109,76,73,.07);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header{
  min-height:76px;padding:14px 5%;
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;font-weight:700}
.brand img{width:42px;height:42px;object-fit:contain}
.brand-name{font-size:18px}
header a{
  color:var(--muted);text-decoration:none;font-size:14px;
  padding:10px 15px;border-radius:12px;background:var(--soft);
}
main{max-width:920px;margin:38px auto;padding:0 20px 60px}
.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:700}
h1{font-size:28px;margin:9px 0}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:25px}
.editor{
  background:var(--surface);border:1px solid var(--line);
  border-radius:22px;padding:30px;box-shadow:var(--shadow);
}
.field{margin-bottom:23px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:9px}
input,textarea,select{
  width:100%;padding:14px 15px;border:1px solid var(--line);
  border-radius:12px;background:#fffdfc;color:var(--text);
  font:inherit;font-size:14px;outline:none;transition:.2s;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(183,123,112,.1);
}
textarea{resize:vertical;line-height:1.85}
#summary{min-height:100px}
#content{min-height:380px}
.hint{font-size:12px;color:#aa918a;margin-top:7px}
.actions{
  display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:23px;margin-top:8px;
}
button{
  border:0;border-radius:12px;padding:13px 23px;
  font-size:14px;font-weight:700;cursor:pointer;transition:.2s;
}
button:hover{transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.draft{background:var(--soft);color:var(--text)}
.publish{background:var(--accent);color:white}
#message{
  display:none;margin-top:18px;padding:14px 16px;
  border-radius:12px;font-size:14px;line-height:1.7;
}
#message.success{display:block;background:#f0f7ef;color:#47704a}
#message.error{display:block;background:#fff0ef;color:#a34e49}
@media(max-width:600px){
  header{padding:12px 16px}
  .brand-name{font-size:16px}
  .brand img{width:36px;height:36px}
  main{margin-top:25px;padding:0 14px 40px}
  h1{font-size:24px}
  .editor{padding:19px;border-radius:17px}
  .actions button{flex:1;padding:13px 10px}
  #content{min-height:300px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/images/hemeng-logo.svg" alt="荷萌 HEMENG">
    <span class="brand-name">荷萌 HEMENG</span>
  </div>
  <a href="articles.html">返回文章列表</a>
</header>

<main>
  <div class="eyebrow">HEMENG · ADMIN</div>
  <h1>编辑文章</h1>
  <div class="subtitle">修改文章内容，保存草稿或重新发布。</div>

  <section class="editor">
    <div class="field">
      <label for="title">文章标题</label>
      <input id="title" type="text" maxlength="200" placeholder="请输入文章标题">
    </div>

    <div class="field">
      <label for="category">文章分类</label>
      <input id="category" type="text" maxlength="50" placeholder="例如：日常记录、技术">
    </div>

    <div class="field">
      <label for="summary">文章摘要</label>
      <textarea id="summary" maxlength="1000" placeholder="用简短文字介绍这篇文章"></textarea>
    </div>

    <div class="field">
      <label for="content">正文内容</label>
      <textarea id="content" maxlength="100000" placeholder="请输入文章正文"></textarea>
      <div class="hint">支持普通文本内容，保存时会保留原有文章字段。</div>
    </div>

    <div class="field">
      <label for="status">当前文章状态</label>
      <select id="status">
        <option value="draft">草稿</option>
        <option value="published">已发布</option>
      </select>
    </div>

    <div class="actions">
      <button class="draft" id="saveDraft" type="button">保存为草稿</button>
      <button class="publish" id="publish" type="button">保存并发布</button>
    </div>
    <div id="message" role="status" aria-live="polite"></div>
  </section>
</main>

<script>
const params = new URLSearchParams(location.search);
const id = Number(params.get("id"));

const titleInput = document.getElementById("title");
const categoryInput = document.getElementById("category");
const summaryInput = document.getElementById("summary");
const contentInput = document.getElementById("content");
const statusInput = document.getElementById("status");
const message = document.getElementById("message");
const draftButton = document.getElementById("saveDraft");
const publishButton = document.getElementById("publish");

let currentSlug = "";

function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
}

async function readJson(response) {
  const result = await response.json();
  if (!response.ok || !result.success) {
    throw new Error(result.message || "请求失败，请稍后重试。");
  }
  return result;
}

async function loadArticle() {
  if (!Number.isInteger(id) || id <= 0) {
    showMessage("文章编号无效，请从文章列表进入。", "error");
    draftButton.disabled = true;
    publishButton.disabled = true;
    return;
  }

  draftButton.disabled = true;
  publishButton.disabled = true;
  showMessage("正在读取文章……", "success");

  try {
    const response = await fetch("/api/admin/posts", {
      credentials: "same-origin",
      cache: "no-store"
    });
    const result = await readJson(response);

    const article = result.posts.find(post => Number(post.id) === id);
    if (!article) throw new Error("没有找到这篇文章。");

    titleInput.value = article.title || "";
    categoryInput.value = article.category || "";
    summaryInput.value = article.summary || "";
    contentInput.value = article.content || "";
    statusInput.value = article.status || "draft";
    currentSlug = article.slug || "";

    showMessage("文章读取成功，可以开始编辑。", "success");
  } catch (error) {
    showMessage(error.message || "读取文章失败。", "error");
  } finally {
    draftButton.disabled = false;
    publishButton.disabled = false;
  }
}

async function saveArticle(status) {
  const title = titleInput.value.trim();
  const content = contentInput.value.trim();

  if (!title || !content) {
    showMessage("标题和正文不能为空。", "error");
    return;
  }

  draftButton.disabled = true;
  publishButton.disabled = true;
  showMessage("正在保存文章……", "success");

  try {
    const response = await fetch("/api/admin/posts", {
      method: "PUT",
      credentials: "same-origin",
      cache: "no-store",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        id,
        title,
        slug: currentSlug,
        category: categoryInput.value.trim() || "未分类",
        summary: summaryInput.value.trim(),
        content,
        status
      })
    });

    await readJson(response);
    statusInput.value = status;

    showMessage(
      status === "published"
        ? "文章修改成功，已正式发布。"
        : "文章修改成功，已保存为草稿。",
      "success"
    );
  } catch (error) {
    showMessage(error.message || "保存失败，请稍后重试。", "error");
  } finally {
    draftButton.disabled = false;
    publishButton.disabled = false;
  }
}

draftButton.addEventListener("click", () => saveArticle("draft"));
publishButton.addEventListener("click", () => saveArticle("published"));

loadArticle();
</script>
</body>
</html>
