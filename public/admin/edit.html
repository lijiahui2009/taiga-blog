
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑文章 - 逢坂大河ws</title>

<style>
:root {
  --bg: #faf7f5;
  --card: #fff;
  --text: #302925;
  --muted: #857a73;
  --line: #eee7e2;
  --accent: #a87568;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

header {
  background: white;
  border-bottom: 1px solid var(--line);
  padding: 17px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 19px;
  font-weight: bold;
}

header a {
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
}

main {
  max-width: 950px;
  margin: 35px auto;
  padding: 0 18px;
}

h1 {
  font-size: 27px;
  margin-bottom: 8px;
}

.subtitle {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 25px;
}

.editor {
  background: white;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 26px;
}

.field {
  margin-bottom: 23px;
}

label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 9px;
}

input, textarea, select {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: white;
  color: var(--text);
  font: inherit;
  font-size: 14px;
  outline: none;
}

input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
}

textarea {
  resize: vertical;
  line-height: 1.8;
}

#summary {
  min-height: 85px;
}

#content {
  min-height: 350px;
}

.actions {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  flex-wrap: wrap;
  border-top: 1px solid var(--line);
  padding-top: 22px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 12px 22px;
  font-size: 14px;
  cursor: pointer;
}

.draft {
  background: #f1ebe7;
  color: var(--text);
}

.publish {
  background: var(--accent);
  color: white;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

#message {
  display: none;
  margin-top: 18px;
  padding: 13px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.6;
}

#message.success {
  display: block;
  background: #edf5ed;
  color: #356b3d;
}

#message.error {
  display: block;
  background: #f9eeee;
  color: #a33e3e;
}

@media(max-width:600px) {
  main {
    margin-top: 24px;
  }

  .editor {
    padding: 18px;
  }

  h1 {
    font-size: 23px;
  }

  .actions button {
    flex: 1;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">逢坂大河ws</div>
  <a href="articles.html">返回文章列表</a>
</header>

<main>

  <h1>编辑文章</h1>
  <div class="subtitle">
    修改文章内容，并保存或重新发布。
  </div>

  <section class="editor">

    <div class="field">
      <label for="title">文章标题</label>
      <input id="title" type="text" maxlength="200"
        placeholder="请输入文章标题">
    </div>

    <div class="field">
      <label for="category">文章分类</label>
      <input id="category" type="text" maxlength="50"
        placeholder="例如：日常记录、技术">
    </div>

    <div class="field">
      <label for="summary">文章摘要</label>
      <textarea id="summary" maxlength="1000"
        placeholder="文章简介"></textarea>
    </div>

    <div class="field">
      <label for="content">正文内容</label>
      <textarea id="content" maxlength="100000"
        placeholder="文章正文"></textarea>
    </div>

    <div class="field">
      <label for="status">文章状态</label>
      <select id="status">
        <option value="draft">草稿</option>
        <option value="published">已发布</option>
      </select>
    </div>

    <div class="actions">
      <button class="draft" id="saveDraft">保存草稿</button>
      <button class="publish" id="publish">保存并发布</button>
    </div>

    <div id="message"></div>

  </section>

</main>

<script>
const params = new URLSearchParams(location.search);
const id = Number(params.get("id"));

const titleInput = document.getElementById("title");
const categoryInput = document.getElementById("category");
const summaryInput = document.getElementById("summary");
const contentInput = document.getElementById("content");
const statusInput = document.getElementById("status");

const message = document.getElementById("message");
const draftButton = document.getElementById("saveDraft");
const publishButton = document.getElementById("publish");

let currentSlug = "";

function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
}

async function loadArticle() {
  if (!Number.isInteger(id) || id <= 0) {
    showMessage("文章编号无效，请从文章列表进入。", "error");
    return;
  }

  try {
    const response = await fetch("/api/admin/posts", {
      credentials: "same-origin",
      cache: "no-store"
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "读取文章失败");
    }

    const article = result.posts.find(
      post => Number(post.id) === id
    );

    if (!article) {
      throw new Error("没有找到这篇文章");
    }

    titleInput.value = article.title || "";
    categoryInput.value = article.category || "";
    summaryInput.value = article.summary || "";
    contentInput.value = article.content || "";
    statusInput.value = article.status || "draft";

    currentSlug = article.slug || "";

    showMessage("文章读取成功，可以开始编辑。", "success");

  } catch (error) {
    showMessage(error.message, "error");
  }
}

async function saveArticle(status) {
  const title = titleInput.value.trim();
  const content = contentInput.value.trim();

  if (!title || !content) {
    showMessage("标题和正文不能为空。", "error");
    return;
  }

  draftButton.disabled = true;
  publishButton.disabled = true;

  showMessage("正在保存……", "success");

  try {
    const response = await fetch("/api/admin/posts", {
      method: "PUT",
      credentials: "same-origin",
      cache: "no-store",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: id,
        title: title,
        slug: currentSlug,
        category: categoryInput.value.trim() || "未分类",
        summary: summaryInput.value.trim(),
        content: content,
        status: status
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "保存失败");
    }

    statusInput.value = status;

    showMessage(
      status === "published"
        ? "文章修改成功，已正式发布。"
        : "文章修改成功，已保存为草稿。",
      "success"
    );

  } catch (error) {
    showMessage(error.message, "error");
  } finally {
    draftButton.disabled = false;
    publishButton.disabled = false;
  }
}

draftButton.addEventListener("click", function() {
  saveArticle("draft");
});

publishButton.addEventListener("click", function() {
  saveArticle("published");
});

loadArticle();
</script>

</body>
</html>
