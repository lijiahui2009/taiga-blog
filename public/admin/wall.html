
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFF7F3">
<title>大河墙审核 - 荷萌 HEMENG</title>
<style>
:root{
  --bg:#FFF7F3;--card:#fff;--pink:#FFE8E0;--pink-deep:#F5C8C0;
  --accent:#B77B70;--text:#6D4C49;--muted:#956258;
  --line:#F0E2DC;--green:#527653;--red:#A34E48;
}
*{box-sizing:border-box}
body{margin:0;padding:0 0 50px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:72px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);padding:0 5%;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:750}
.brand img{width:40px;height:40px;object-fit:contain}
header a{color:var(--muted);text-decoration:none;font-size:13px}
.container{max-width:1000px;margin:36px auto;padding:0 18px}
.eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:2px;margin-bottom:10px}
h1{font-size:27px;margin:0 0 9px}
.subtitle{color:var(--muted);font-size:14px;line-height:1.8}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:23px 0}
nav a{color:var(--muted);text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13px}
nav a:hover{background:var(--pink);color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 10px 30px rgba(109,76,73,.05)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px}
input,select{min-width:0;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#FFFCFA;color:var(--text);font-size:14px;outline:none}
input{flex:1}
select{flex:0 0 auto}
input:focus,select:focus{border-color:var(--accent)}
button{border:0;border-radius:9px;padding:10px 14px;font-size:13px;cursor:pointer;transition:.2s}
.refresh{background:var(--pink);color:var(--text)}
.refresh:hover{background:var(--pink-deep)}
.approve{background:#EFF6EF;color:var(--green)}
.reject{background:#FFF0EE;color:var(--red)}
.pending{background:#FFF3E7;color:#98734F}
.delete{background:#F7EEEE;color:#A34E48}
button:hover{filter:brightness(.97)}
.post{border:1px solid var(--line);border-radius:13px;padding:18px;margin-top:14px;background:#fff}
.post-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.meta{color:var(--muted);font-size:12px;line-height:1.8;overflow-wrap:anywhere}
.status{font-size:11px;padding:6px 10px;border-radius:20px;background:#F5F0ED;white-space:nowrap}
.status-pending{color:#98734F;background:#FFF3E7}
.status-approved{color:var(--green);background:#EFF6EF}
.status-rejected{color:var(--red);background:#FFF0EE}
.content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font-size:14px;margin:13px 0 17px}
.actions{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.message{color:var(--muted);font-size:13px;padding:17px 2px;line-height:1.7}
.error{color:var(--red)}
@media(max-width:550px){
 header{height:65px;padding:0 15px}
 .brand{font-size:16px;gap:8px}
 .brand img{width:35px;height:35px}
 .container{margin:27px auto;padding:0 13px}
 h1{font-size:24px}
 .panel{padding:14px}
 .toolbar{flex-direction:column}
 input,select{width:100%;flex:auto}
 .post{padding:14px}
 .actions button{flex:1}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="/images/hemeng-logo.svg" alt="荷萌 HEMENG">
    <span>荷萌 HEMENG</span>
  </div>
  <a href="dashboard.html">返回管理首页</a>
</header>

<div class="container">
  <div class="eyebrow">HEMENG · COMMUNITY</div>
  <h1>大河墙审核</h1>
  <div class="subtitle">管理访客投稿，审核通过后才会公开显示。</div>

  <nav>
    <a href="dashboard.html">管理首页</a>
    <a href="write.html">写文章</a>
    <a href="articles.html">文章管理</a>
    <a href="wall.html">大河墙审核</a>
    <a href="settings.html">网站设置</a>
    <a href="/">返回网站</a>
  </nav>

  <section class="panel">
    <div class="toolbar">
      <input id="search" placeholder="搜索投稿内容或昵称">
      <select id="filter">
        <option value="all">全部投稿</option>
        <option value="pending">待审核</option>
        <option value="approved">已通过</option>
        <option value="rejected">已拒绝</option>
      </select>
      <button class="refresh" id="refresh">刷新投稿</button>
    </div>

    <div id="message" class="message">正在加载投稿...</div>
    <div id="postList"></div>
  </section>
</div>

<script>
const postList = document.getElementById("postList");
const message = document.getElementById("message");
const searchInput = document.getElementById("search");
const filterSelect = document.getElementById("filter");

let posts = [];

const statusNames = {
  pending: "待审核",
  approved: "已通过",
  rejected: "已拒绝"
};

function showMessage(text, isError = false) {
  message.textContent = text;
  message.className = isError ? "message error" : "message";
}

function createButton(text, className, callback) {
  const button = document.createElement("button");
  button.textContent = text;
  button.className = className;
  button.addEventListener("click", callback);
  return button;
}

async function loadPosts() {
  showMessage("正在加载投稿...");
  postList.replaceChildren();

  try {
    const response = await fetch("/api/admin/wall", {
      method: "GET",
      credentials: "same-origin",
      cache: "no-store"
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "读取投稿失败");
    }

    posts = Array.isArray(data.posts) ? data.posts : [];
    renderPosts();
  } catch (error) {
    showMessage(
      "加载失败：" + error.message + "。请检查管理员登录状态或 API 部署情况。",
      true
    );
  }
}

function renderPosts() {
  postList.replaceChildren();

  const keyword = searchInput.value.trim().toLowerCase();
  const selectedFilter = filterSelect.value;

  const filtered = posts.filter(post => {
    const matchesStatus =
      selectedFilter === "all" || post.status === selectedFilter;

    const matchesKeyword =
      String(post.content || "").toLowerCase().includes(keyword) ||
      String(post.nickname || "").toLowerCase().includes(keyword);

    return matchesStatus && matchesKeyword;
  });

  if (filtered.length === 0) {
    showMessage(
      posts.length === 0 ? "目前还没有投稿。" : "没有找到符合条件的投稿。"
    );
    return;
  }

  showMessage("共找到 " + filtered.length + " 条投稿。");

  filtered.forEach(post => {
    const card = document.createElement("article");
    card.className = "post";

    const top = document.createElement("div");
    top.className = "post-top";

    const info = document.createElement("div");
    info.className = "meta";

    const author = post.is_anonymous
      ? "匿名投稿"
      : "昵称：" + (post.nickname || "未填写");

    info.textContent =
      (post.category || "未分类") + " · " + author +
      " · " + (post.created_at || "");

    const status = document.createElement("span");
    status.className = "status status-" + post.status;
    status.textContent = statusNames[post.status] || post.status;

    top.appendChild(info);
    top.appendChild(status);

    const content = document.createElement("div");
    content.className = "content";
    content.textContent = post.content || "";

    const actions = document.createElement("div");
    actions.className = "actions";

    if (post.status !== "approved") {
      actions.appendChild(createButton("通过审核", "approve", () => {
        updateStatus(post.id, "approved");
      }));
    }

    if (post.status !== "rejected") {
      actions.appendChild(createButton("拒绝投稿", "reject", () => {
        updateStatus(post.id, "rejected");
      }));
    }

    if (post.status !== "pending") {
      actions.appendChild(createButton("恢复待审核", "pending", () => {
        updateStatus(post.id, "pending");
      }));
    }

    actions.appendChild(createButton("删除", "delete", () => {
      deletePost(post.id);
    }));

    card.appendChild(top);
    card.appendChild(content);
    card.appendChild(actions);
    postList.appendChild(card);
  });
}

async function updateStatus(id, status) {
  const actionName = statusNames[status] || status;

  if (!confirm("确定要将这条投稿设为「" + actionName + "」吗？")) {
    return;
  }

  try {
    const response = await fetch("/api/admin/wall", {
      method: "PUT",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, status, review_note: "" })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "操作失败");
    }

    await loadPosts();
  } catch (error) {
    alert("操作失败：" + error.message);
  }
}

async function deletePost(id) {
  if (!confirm("确定永久删除这条投稿吗？删除后无法恢复。")) {
    return;
  }

  try {
    const response = await fetch("/api/admin/wall", {
      method: "DELETE",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "删除失败");
    }

    await loadPosts();
  } catch (error) {
    alert("删除失败：" + error.message);
  }
}

searchInput.addEventListener("input", renderPosts);
filterSelect.addEventListener("change", renderPosts);
document.getElementById("refresh").addEventListener("click", loadPosts);

loadPosts();
</script>
</body>
</html>
