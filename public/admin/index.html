<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff7f3">
<title>管理员登录 - 荷萌 HEMENG</title>

<style>
:root {
  --bg:#fff7f3;
  --card:#ffffff;
  --text:#493b38;
  --muted:#8b7c76;
  --border:#f0e3de;
  --accent:#b77b70;
  --accent-dark:#956258;
  --soft:#fff0ea;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at 15% 15%,#ffe8e0,transparent 32%),
    radial-gradient(circle at 90% 85%,#ffe8e0,transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "Microsoft YaHei",sans-serif;
}

.login-card{
  width:100%;
  max-width:410px;
  padding:38px 30px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:21px;
  box-shadow:0 15px 45px rgba(109,76,73,.07);
}

.logo{
  display:block;
  width:155px;
  height:auto;
  max-height:90px;
  object-fit:contain;
  object-position:left center;
  margin-bottom:27px;
}

.eyebrow{
  color:var(--accent);
  font-size:10px;
  font-weight:700;
  letter-spacing:3px;
}

h1{
  margin:13px 0 9px;
  font-size:27px;
  letter-spacing:1px;
}

.subtitle{
  margin:0 0 29px;
  color:var(--muted);
  font-size:13px;
  line-height:1.9;
}

label{
  display:block;
  margin-bottom:9px;
  font-size:13px;
  font-weight:600;
}

input{
  width:100%;
  height:49px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:11px;
  outline:none;
  background:#fffdfc;
  color:var(--text);
  font-size:15px;
  transition:.2s;
}

input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(183,123,112,.12);
}

button{
  width:100%;
  height:49px;
  margin-top:19px;
  border:0;
  border-radius:11px;
  background:var(--accent);
  color:white;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  background:var(--accent-dark);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  min-height:24px;
  margin-top:15px;
  font-size:13px;
  line-height:1.7;
  color:#a34f45;
  overflow-wrap:anywhere;
}

.back{
  display:block;
  margin-top:22px;
  color:var(--muted);
  text-align:center;
  text-decoration:none;
  font-size:12px;
}

.back:hover{color:var(--accent)}

.footer{
  margin-top:27px;
  padding-top:19px;
  border-top:1px solid var(--border);
  color:#aa9690;
  text-align:center;
  font-size:10px;
  line-height:2;
}

@media(max-width:450px){
  .login-card{padding:31px 23px}
  h1{font-size:24px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition:none!important;
  }
}
</style>
</head>

<body>

<main class="login-card">

  <img
    class="logo"
    src="/images/hemeng-logo.svg"
    alt="荷萌 HEMENG"
  >

  <div class="eyebrow">HEMENG · ADMINISTRATION</div>

  <h1>管理员登录</h1>

  <p class="subtitle">
    欢迎进入荷萌管理后台。<br>
    请输入管理员密码以继续。
  </p>

  <form id="loginForm">

    <label for="password">管理员密码</label>

    <input
      id="password"
      type="password"
      placeholder="请输入管理员密码"
      autocomplete="current-password"
      required
      maxlength="256"
    >

    <button id="submitButton" type="submit">
      登录管理后台
    </button>

    <div class="message" id="message"
      role="status" aria-live="polite"></div>

  </form>

  <a class="back" href="/">← 返回网站首页</a>

  <div class="footer">
    荷萌 HEMENG<br>
    一个持续建设中的个人互联网空间
  </div>

</main>

<script>
const form = document.getElementById("loginForm");
const passwordInput = document.getElementById("password");
const button = document.getElementById("submitButton");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const password = passwordInput.value;

  if (!password) {
    message.textContent = "请输入管理员密码。";
    return;
  }

  button.disabled = true;
  button.textContent = "正在验证...";
  message.style.color = "#a34f45";
  message.textContent = "";

  try {
    const response = await fetch(
      "/api/admin/login",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "same-origin",
        cache: "no-store",
        body: JSON.stringify({
          password: password
        })
      }
    );

    const responseText = await response.text();

    let result;

    try {
      result = JSON.parse(responseText);
    } catch {
      throw new Error(
        "服务器返回了非JSON内容，HTTP状态：" +
        response.status
      );
    }

    if (!response.ok || !result.success) {
      message.textContent =
        result.message ||
        "登录失败，HTTP状态：" + response.status;

      return;
    }

    message.style.color = "#39845b";
    message.textContent = "登录成功，正在进入管理后台……";

    passwordInput.value = "";

    window.location.href = "/admin/dashboard.html";

  } catch (error) {
    message.style.color = "#a34f45";
    message.textContent =
      "请求异常：" + error.message;

  } finally {
    button.disabled = false;
    button.textContent = "登录管理后台";
  }
});
</script>

</body>
</html>
