
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#faf7f5">
<title>管理员登录 - 逢坂大河ws</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: #faf7f5;
  color: #302a28;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
}

.login-card {
  width: 100%;
  max-width: 390px;
  padding: 36px 28px;
  background: #fff;
  border: 1px solid #eee6e2;
  border-radius: 18px;
  box-shadow: 0 12px 40px rgba(50, 35, 25, 0.06);
}

.logo {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  margin-bottom: 24px;
  border-radius: 14px;
  background: #f5e8e5;
  color: #a65d54;
  font-size: 23px;
}

h1 {
  margin: 0 0 9px;
  font-size: 25px;
}

.subtitle {
  margin: 0 0 28px;
  color: #887e79;
  font-size: 14px;
  line-height: 1.7;
}

label {
  display: block;
  margin-bottom: 9px;
  font-size: 14px;
  font-weight: 600;
}

input {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  border: 1px solid #e8dfda;
  border-radius: 10px;
  outline: none;
  font-size: 16px;
}

input:focus {
  border-color: #b77b70;
  box-shadow: 0 0 0 3px rgba(183, 123, 112, 0.12);
}

button {
  width: 100%;
  height: 48px;
  margin-top: 20px;
  border: 0;
  border-radius: 10px;
  background: #a9655b;
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.message {
  min-height: 24px;
  margin-top: 16px;
  font-size: 14px;
  line-height: 1.6;
  color: #a34f45;
}

.back {
  display: block;
  margin-top: 22px;
  color: #887e79;
  text-align: center;
  text-decoration: none;
  font-size: 13px;
}
</style>
</head>

<body>

<main class="login-card">
  <div class="logo">虎</div>

  <h1>管理员登录</h1>
  <p class="subtitle">
    逢坂大河ws的综合站<br>
    请输入管理员密码以继续。
  </p>

  <form id="loginForm">
    <label for="password">管理员密码</label>

    <input
      id="password"
      type="password"
      placeholder="请输入管理员密码"
      autocomplete="current-password"
      required
      maxlength="256"
    >

    <button id="submitButton" type="submit">
      登录管理后台
    </button>

    <div class="message" id="message" role="status"></div>
  </form>

  <a class="back" href="/">返回网站首页</a>
</main>

<script>
const form = document.getElementById("loginForm");
const passwordInput = document.getElementById("password");
const button = document.getElementById("submitButton");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const password = passwordInput.value;

  if (!password) {
    message.textContent = "请输入管理员密码。";
    return;
  }

  button.disabled = true;
  button.textContent = "正在验证...";
  message.textContent = "";

  try {
    const response = await fetch("/api/admin/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      credentials: "same-origin",
      cache: "no-store",
      body: JSON.stringify({ password })
    });

    const result = await response.json();

    if (response.ok && result.success) {
      message.style.color = "#39845b";
      message.textContent = "登录成功，正在进入管理后台……";

      passwordInput.value = "";

      setTimeout(() => {
        window.location.href = "/admin/dashboard.html";
      }, 800);

    } else {
      message.style.color = "#a34f45";
      message.textContent = result.message || "登录失败，请检查密码。";
    }

  } catch (error) {
    message.textContent = "连接服务器失败，请稍后重试。";
  }

  button.disabled = false;
  button.textContent = "登录管理后台";
});
</script>

</body>
</html>
